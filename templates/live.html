<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vehicle Detection - Full Screen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
    :root {
        --primary: #2c3e50;
        --secondary: #3498db;
        --success: #27ae60;
        --warning: #f39c12;
        --danger: #e74c3c;
    }

    body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        height: 100vh;
    }

    .navbar {
        background-color: var(--primary) !important;
        border: none;
    }

    .navbar-brand {
        font-weight: 700;
        color: white !important;
    }

    .fullscreen-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 1000;
        display: flex;
        flex-direction: column;
    }

    .video-header {
        background: rgba(44, 62, 80, 0.95);
        color: white;
        padding: 15px 20px;
        border-bottom: 2px solid var(--secondary);
        z-index: 1001;
        backdrop-filter: blur(10px);
    }

    .live-indicator {
        background: var(--danger);
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
    }

    .video-container {
        flex: 1;
        position: relative;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .video-feed {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }

    .controls-overlay {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        padding: 15px 25px;
        border-radius: 50px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 15px;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .video-container:hover .controls-overlay {
        opacity: 1;
    }

    .control-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .control-btn:hover {
        background: var(--secondary);
        transform: scale(1.1);
    }

    .control-btn.exit {
        background: var(--danger);
    }

    .control-btn.exit:hover {
        background: #c82333;
        transform: scale(1.1);
    }

    .stats-overlay {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 15px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        min-width: 200px;
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .stat-item:last-child {
        margin-bottom: 0;
    }

    .stat-value {
        font-weight: 600;
        color: var(--success);
    }

    .connection-status {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 15px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
    }

    .connection-status.connected {
        border-left: 4px solid var(--success);
    }

    .connection-status.connecting {
        border-left: 4px solid var(--warning);
    }

    .connection-status.error {
        border-left: 4px solid var(--danger);
    }

    .detection-info {
        position: absolute;
        bottom: 100px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 15px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 300px;
    }

    .detection-item {
        margin-bottom: 5px;
        font-size: 0.9rem;
    }

    .timestamp {
        font-size: 0.8rem;
        color: #ccc;
        margin-top: 5px;
    }

    /* Loading animation */
    .loading-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
    }

    .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid var(--secondary);
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .stats-overlay {
            top: 10px;
            right: 10px;
            min-width: 150px;
            padding: 10px;
        }
        
        .connection-status {
            top: 10px;
            left: 10px;
            padding: 8px 12px;
        }
        
        .detection-info {
            bottom: 80px;
            left: 10px;
            max-width: 200px;
        }
        
        .controls-overlay {
            bottom: 10px;
            padding: 10px 20px;
        }
        
        .control-btn {
            width: 40px;
            height: 40px;
        }
    }

    @media (max-width: 480px) {
        .video-header h4 {
            font-size: 1.1rem;
        }
        
        .stats-overlay {
            display: none;
        }
    }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <!-- Header -->
        <div class="video-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <h4 class="mb-0 me-3">
                    <i class="fas fa-car me-2"></i>Live Vehicle Detection
                </h4>
                <span class="live-indicator">
                    <i class="fas fa-circle me-1"></i> LIVE
                </span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span id="currentTime" class="text-light"></span>
                <a href="/index" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>

        <!-- Video Container -->
        <div class="video-container">
            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <div>Loading live stream...</div>
            </div>

            <!-- Video Feed -->
            <img src="{{ url_for('video_feed') }}" class="video-feed" id="videoFeed" alt="Live Vehicle Detection Stream" onload="hideLoading()" onerror="showError()">

            <!-- Connection Status -->
            <div class="connection-status connected" id="connectionStatus">
                <i class="fas fa-wifi me-2"></i>
                <span>Stream Connected</span>
            </div>

            <!-- Statistics Overlay -->
            <div class="stats-overlay">
                <h6 class="mb-3"><i class="fas fa-chart-bar me-2"></i>Live Stats</h6>
                <div class="stat-item">
                    <span>Total Detections:</span>
                    <span class="stat-value" id="totalDetections">0</span>
                </div>
                <div class="stat-item">
                    <span>Active Session:</span>
                    <span class="stat-value" id="sessionTime">0m</span>
                </div>
                <div class="stat-item">
                    <span>Frame Rate:</span>
                    <span class="stat-value" id="frameRate">0 fps</span>
                </div>
                <div class="stat-item">
                    <span>Stream Quality:</span>
                    <span class="stat-value" id="streamQuality">Good</span>
                </div>
            </div>

            <!-- Recent Detection Info -->
            <div class="detection-info" id="detectionInfo" style="display: none;">
                <h6 class="mb-2"><i class="fas fa-car me-2"></i>Last Detection</h6>
                <div class="detection-item" id="lastVehicleType">Vehicle: -</div>
                <div class="detection-item" id="lastPlate">Plate: -</div>
                <div class="timestamp" id="lastDetectionTime">Just now</div>
            </div>

            <!-- Controls Overlay -->
            <div class="controls-overlay">
                <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
                <button class="control-btn" onclick="refreshStream()" title="Refresh Stream">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="control-btn" onclick="toggleStats()" title="Toggle Statistics">
                    <i class="fas fa-chart-bar"></i>
                </button>
                <button class="control-btn exit" onclick="exitFullscreen()" title="Exit">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize variables
        let sessionStartTime = Date.now();
        let frameCount = 0;
        let lastFrameTime = Date.now();
        let detectionCount = 0;
        let statsVisible = true;

        // Update current time
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleTimeString() + ' • ' + now.toLocaleDateString();
        }

        // Update session time
        function updateSessionTime() {
            const elapsed = Math.floor((Date.now() - sessionStartTime) / 60000);
            document.getElementById('sessionTime').textContent = elapsed + 'm';
        }

        // Calculate frame rate
        function updateFrameRate() {
            frameCount++;
            const now = Date.now();
            const elapsed = (now - lastFrameTime) / 1000;
            
            if (elapsed >= 1) {
                const fps = Math.round(frameCount / elapsed);
                document.getElementById('frameRate').textContent = fps + ' fps';
                frameCount = 0;
                lastFrameTime = now;
                
                // Update stream quality indicator
                const quality = fps > 20 ? 'Excellent' : fps > 10 ? 'Good' : fps > 5 ? 'Fair' : 'Poor';
                document.getElementById('streamQuality').textContent = quality;
                document.getElementById('streamQuality').style.color = 
                    fps > 20 ? '#27ae60' : fps > 10 ? '#f39c12' : '#e74c3c';
            }
        }

        // Hide loading spinner when video loads
        function hideLoading() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('videoFeed').style.display = 'block';
        }

        // Show error if video fails to load
        function showError() {
            document.getElementById('loadingSpinner').innerHTML = `
                <div style="color: #e74c3c;">
                    <i class="fas fa-exclamation-triangle fa-2x mb-3"></i>
                    <div>Failed to load stream</div>
                    <button class="btn btn-warning btn-sm mt-2" onclick="refreshStream()">
                        <i class="fas fa-sync-alt me-1"></i>Retry
                    </button>
                </div>
            `;
            document.getElementById('connectionStatus').className = 'connection-status error';
            document.getElementById('connectionStatus').innerHTML = `
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span>Connection Error</span>
            `;
        }

        // Refresh the video stream
        function refreshStream() {
            const videoFeed = document.getElementById('videoFeed');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            loadingSpinner.style.display = 'block';
            videoFeed.style.display = 'none';
            
            // Add timestamp to bypass cache
            videoFeed.src = "{{ url_for('video_feed') }}?t=" + new Date().getTime();
            
            // Reset connection status
            document.getElementById('connectionStatus').className = 'connection-status connecting';
            document.getElementById('connectionStatus').innerHTML = `
                <i class="fas fa-sync-alt fa-spin me-2"></i>
                <span>Reconnecting...</span>
            `;
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Exit fullscreen and go back to dashboard
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
            window.location.href = '/';
        }

        // Toggle statistics overlay
        function toggleStats() {
            const statsOverlay = document.querySelector('.stats-overlay');
            statsVisible = !statsVisible;
            statsOverlay.style.display = statsVisible ? 'block' : 'none';
        }

        // Simulate detection updates (in real app, this would come from WebSocket)
        function simulateDetectionUpdate() {
            // Randomly update detection info for demo purposes
            if (Math.random() < 0.02) { // 2% chance every second
                detectionCount++;
                document.getElementById('totalDetections').textContent = detectionCount;
                
                const vehicleTypes = ['Car', 'Truck', 'Motorcycle', 'Bus'];
                const plates = ['RAA123A', 'RAB456B', 'RAC789C', 'RAD012D', 'RAE345E'];
                
                document.getElementById('lastVehicleType').textContent = 
                    'Vehicle: ' + vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
                document.getElementById('lastPlate').textContent = 
                    'Plate: ' + plates[Math.floor(Math.random() * plates.length)];
                document.getElementById('lastDetectionTime').textContent = 'Just now';
                
                // Show detection info
                document.getElementById('detectionInfo').style.display = 'block';
                
                // Hide after 5 seconds
                setTimeout(() => {
                    document.getElementById('detectionInfo').style.display = 'none';
                }, 5000);
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 1000);
            setInterval(updateSessionTime, 60000);
            setInterval(updateFrameRate, 100);
            setInterval(simulateDetectionUpdate, 1000);
            
            // Handle fullscreen changes
            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement) {
                    // User exited fullscreen, go back to dashboard
                    window.location.href = '/';
                }
            });
            
            // Auto-refresh stream every 5 minutes to prevent timeout
            setInterval(refreshStream, 300000);
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // Page is hidden, pause updates if needed
            } else {
                // Page is visible, refresh stream
                refreshStream();
            }
        });
    </script>
</body>
</html>
